name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: |
          npm init -y
          npm install @capacitor/core@5.7.0 @capacitor/cli@5.7.0 @capacitor/android@5.7.0
          npm install @capacitor/app@5.0.7 @capacitor/filesystem@5.2.1 @capacitor/share@5.0.7

      - name: Prepare Web Assets
        run: |
          mkdir -p www
          cp index.html www/
          cp manifest.json www/ 2>/dev/null || :

      - name: Build Android App
        run: |
          npx cap add android || npx cap sync android
          cd android
          ./gradlew assembleDebug --no-daemon --no-build-cache

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: El-Sayeh-Store-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
